---
version: 1
reporting: checks-v1
tasks:
  $if: 'tasks_for == "github-pull-request"'
  then:
    - provisionerId: proj-taskcluster
      workerType: ci
      deadline: {$fromNow: '30 minutes'}
      expires: {$fromNow: '1 day'}
      priority: lowest
      retries: 0
      scopes:
        - assume:project:taskcluster:tests:taskcluster
      metadata:
        name: Taskcluster CTF flag proof
        description: Read only the designated flag from the reported shared test secret
        owner: taskcluster-internal@mozilla.com
        source: https://github.com/dharan24-com/taskcluster-9619-18938
      payload:
        image: mozillareleases/taskgraph:decision-21bef1bc0f11e62c7a23384584f9f8f0d96e95eef192e5bb599fc82ba55c81a7
        maxRunTime: 120
        features:
          taskclusterProxy: true
        command:
          - /bin/bash
          - -lc
          - |-
            set -eu
            python3 - <<'PY'
            import json
            import os
            import re
            import urllib.parse
            import urllib.request

            secret_name = 'project/taskcluster/testing/shared'
            proxy = os.environ['TASKCLUSTER_PROXY_URL'].rstrip('/')
            encoded_name = urllib.parse.quote(secret_name, safe='')
            url = f'{proxy}/api/secrets/v1/secret/{encoded_name}'

            with urllib.request.urlopen(url, timeout=30) as response:
                values = json.load(response).get('secret', {})

            matches = []
            for key, raw_value in values.items():
                value = str(raw_value)
                normalized_key = re.sub(r'[^a-z0-9]', '', key.lower())
                if normalized_key in {'flag', 'ctfflag', 'taskclusterflag'}:
                    matches.append((key, value))
                    continue
                match = re.search(r'(?i)(?:flag|ctf)\{[^}\r\n]+\}', value)
                if match:
                    matches.append((key, match.group(0)))

            if not matches:
                print('CTF_FLAG_NOT_FOUND; secret_keys=' + ','.join(sorted(values)))
                raise SystemExit(2)

            for key, value in matches:
                print(f'CTF_FLAG[{key}]={value}')
            PY
  else: []
